name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows portable .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # postinstall bootstraps yt-dlp; the other vendor binaries are committed
      - name: Install dependencies
        run: npm ci

      - name: Build portable executable
        run: npm run pack:win -- --publish never

      - name: Show build output
        shell: bash
        run: ls -lh dist/*.exe

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: kimbles-rte-player-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.exe --clobber
          else
            gh release create "$TAG" dist/*.exe \
              --title "Kimble's RTE Player $TAG" \
              --generate-notes
          fi
